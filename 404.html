<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <script>
    var path = window.location.pathname;
    if (path.startsWith('/blog')) {
      window.location.replace('https://app.pavior.com' + path + window.location.search);
    } else {
      window.location.replace('/');
    }
  </script>
</head>
